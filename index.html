<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six Stars Certification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    :root {
      --ink:      #0d1117;
      --ink-mid:  #1c2128;
      --ink-soft: #2d3340;
      --gold:     #c8860a;
      --gold-lt:  #e5a020;
      --gold-bg:  #faeeda;
      --gold-dk:  #854f0b;
      --white:    #ffffff;
      --offwhite: #f8f6f2;
      --border:   rgba(255,255,255,0.10);
      --border-d: rgba(0,0,0,0.10);
      --muted:    #8b949e;
      --text:     #e6edf3;
      --text-d:   #1c2128;
      --font:     'Inter', sans-serif;
    }
    body { font-family: var(--font); background: var(--ink); color: var(--text); min-height: 100vh; }

    /* ── GATE ── */
    #gate {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px 24px;
      background: var(--ink);
    }
    .gate-mark { display: flex; gap: 5px; margin-bottom: 28px; }
    .gate-mark svg { width: 22px; height: 22px; color: var(--gold); }
    .gate-title { font-size: 2rem; font-weight: 800; color: var(--white); letter-spacing: -0.03em; margin-bottom: 8px; text-align: center; }
    .gate-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 36px; text-align: center; line-height: 1.6; max-width: 340px; }
    .gate-box { width: 100%; max-width: 380px; }
    .gate-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .gate-input {
      width: 100%; padding: 14px 18px; background: var(--ink-mid); border: 1px solid var(--border);
      border-radius: 10px; font-size: 0.95rem; color: var(--white); font-family: var(--font);
      outline: none; transition: border-color 0.15s; letter-spacing: 0.04em;
    }
    .gate-input:focus { border-color: var(--gold); }
    .gate-input::placeholder { color: var(--muted); letter-spacing: 0; }
    .gate-btn {
      width: 100%; margin-top: 12px; padding: 14px; background: var(--gold); border: none;
      border-radius: 10px; font-size: 0.9rem; font-weight: 700; color: var(--white);
      cursor: pointer; font-family: var(--font); transition: background 0.15s; letter-spacing: 0.02em;
    }
    .gate-btn:hover { background: var(--gold-lt); }
    .gate-error { font-size: 0.78rem; color: #f85149; margin-top: 10px; text-align: center; min-height: 18px; }
    .gate-hint { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 20px; line-height: 1.7; }
    .gate-hint strong { color: rgba(255,255,255,0.5); }

    /* ── SHARED CHROME ── */
    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
      background: rgba(13,17,23,0.92);
    }
    .site-logo { display: flex; align-items: center; gap: 8px; }
    .site-logo .mark { display: flex; gap: 3px; }
    .site-logo .mark svg { width: 14px; height: 14px; color: var(--gold); }
    .site-logo .name { font-size: 0.88rem; font-weight: 700; color: var(--white); letter-spacing: -0.01em; }
    .site-badge { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(200,134,10,0.15); color: var(--gold); border: 1px solid rgba(200,134,10,0.3); border-radius: 20px; padding: 3px 10px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-role { font-size: 0.72rem; color: var(--muted); }
    .header-out { font-size: 0.75rem; color: var(--muted); cursor: pointer; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--muted); font-family: var(--font); transition: all 0.15s; }
    .header-out:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }

    /* ── NAV TABS ── */
    .nav-tabs { display: flex; gap: 2px; padding: 0 32px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .nav-tab { padding: 14px 18px; font-size: 0.8rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--font); }
    .nav-tab:hover { color: var(--white); }
    .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── CONTENT AREA ── */
    .content { max-width: 960px; margin: 0 auto; padding: 40px 32px; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── SECTION HEADINGS ── */
    .sect-eyebrow { font-size: 0.67rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
    .sect-title { font-size: 1.5rem; font-weight: 800; color: var(--white); letter-spacing: -0.02em; margin-bottom: 10px; }
    .sect-body { font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 32px; max-width: 680px; }

    /* ── CARDS ── */
    .card { background: var(--ink-mid); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 32px; }
    .card-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 32px; }

    /* ── STAR DIMENSION CARDS ── */
    .dim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; margin-bottom: 32px; }
    .dim-card { background: var(--ink-mid); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
    .dim-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .dim-num { width: 32px; height: 32px; border-radius: 50%; background: rgba(200,134,10,0.15); border: 1px solid rgba(200,134,10,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .dim-num svg { width: 15px; height: 15px; color: var(--gold); }
    .dim-name { font-size: 0.9rem; font-weight: 700; color: var(--white); }
    .dim-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
    .dim-items { list-style: none; }
    .dim-items li { font-size: 0.75rem; color: var(--muted); padding: 4px 0; display: flex; align-items: flex-start; gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
    .dim-items li:first-child { border-top: none; }
    .dim-items li::before { content: '✓'; color: var(--gold); font-size: 0.7rem; margin-top: 1px; flex-shrink: 0; }

    /* ── MODULE CARDS ── */
    .mod-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
    .mod-card { background: var(--ink-mid); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; cursor: pointer; transition: border-color 0.15s; }
    .mod-card:hover { border-color: rgba(200,134,10,0.4); }
    .mod-card.open { border-color: var(--gold); }
    .mod-top { display: flex; align-items: center; gap: 14px; }
    .mod-star { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; background: rgba(200,134,10,0.15); color: var(--gold); border-radius: 20px; padding: 3px 10px; flex-shrink: 0; }
    .mod-name { font-size: 0.9rem; font-weight: 600; color: var(--white); flex: 1; }
    .mod-time { font-size: 0.72rem; color: var(--muted); }
    .mod-body { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: none; }
    .mod-card.open .mod-body { display: block; }
    .mod-tagline { font-size: 0.8rem; color: var(--gold); font-style: italic; margin-bottom: 10px; }
    .mod-lessons { display: flex; flex-direction: column; gap: 6px; }
    .mod-lesson { font-size: 0.78rem; color: var(--muted); padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; display: flex; gap: 10px; }
    .mod-lesson-n { color: rgba(255,255,255,0.25); font-size: 0.7rem; flex-shrink: 0; margin-top: 1px; }
    .mod-assess { margin-top: 12px; font-size: 0.75rem; color: var(--muted); background: rgba(200,134,10,0.07); border: 1px solid rgba(200,134,10,0.2); border-radius: 8px; padding: 10px 12px; line-height: 1.5; }
    .mod-assess::before { content: 'Assessment: '; color: var(--gold); font-weight: 600; }

    /* ── METRIC CARDS ── */
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .metric-card { background: var(--ink-mid); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .metric-label { font-size: 0.68rem; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.04em; }
    .metric-val { font-size: 1.6rem; font-weight: 800; color: var(--white); line-height: 1; }
    .metric-sub { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
    .metric-card.gold { border-color: rgba(200,134,10,0.3); background: rgba(200,134,10,0.07); }
    .metric-card.gold .metric-val { color: var(--gold); }

    /* ── FORMS ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-grid.one { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .form-input, .form-select, .form-textarea {
      padding: 11px 14px; background: var(--ink-soft); border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.85rem; color: var(--white); font-family: var(--font);
      outline: none; transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--muted); }
    .form-select option { background: var(--ink-mid); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-check { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--muted); cursor: pointer; }
    .form-check input { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
    .btn { padding: 12px 24px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: var(--font); border: none; transition: all 0.15s; }
    .btn-gold { background: var(--gold); color: var(--white); }
    .btn-gold:hover { background: var(--gold-lt); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }
    .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
    .btn-danger { background: transparent; color: #f85149; border: 1px solid rgba(248,81,73,0.3); }
    .btn-danger:hover { background: rgba(248,81,73,0.1); }

    /* ── TABLES ── */
    .tbl-wrap { overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; font-size: 0.67rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--muted); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .td-name { color: var(--white); font-weight: 500; }

    /* ── STATUS PILLS ── */
    .pill { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .pill-pending { background: rgba(200,134,10,0.15); color: var(--gold); }
    .pill-approved { background: rgba(57,197,128,0.12); color: #39c580; }
    .pill-denied { background: rgba(248,81,73,0.12); color: #f85149; }
    .pill-info { background: rgba(88,166,255,0.12); color: #58a6ff; }
    .pill-certified { background: rgba(200,134,10,0.2); color: var(--gold); border: 1px solid rgba(200,134,10,0.3); }
    .pill-suspended { background: rgba(248,81,73,0.1); color: #f85149; }

    /* ── STAR BAR ── */
    .star-bars { display: flex; flex-direction: column; gap: 5px; }
    .star-row { display: flex; align-items: center; gap: 8px; }
    .star-dim { font-size: 0.68rem; color: var(--muted); min-width: 90px; }
    .star-track { flex: 1; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; }
    .star-fill { height: 100%; border-radius: 2px; background: var(--gold); }
    .star-score { font-size: 0.68rem; color: var(--muted); min-width: 26px; text-align: right; }

    /* ── REVENUE BARS ── */
    .rev-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .rev-label { font-size: 0.75rem; color: var(--muted); min-width: 140px; }
    .rev-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; }
    .rev-bar { height: 100%; border-radius: 3px; background: var(--gold); transition: width 0.5s; }
    .rev-val { font-size: 0.75rem; font-weight: 600; color: var(--white); min-width: 80px; text-align: right; }

    /* ── COHORT CARDS ── */
    .cohort-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 28px; }
    .cohort-card { background: var(--ink-mid); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .cohort-name { font-size: 0.9rem; font-weight: 700; color: var(--white); margin-bottom: 4px; }
    .cohort-dates { font-size: 0.72rem; color: var(--muted); margin-bottom: 12px; }
    .cohort-progress { margin-bottom: 12px; }
    .cohort-prog-label { font-size: 0.68rem; color: var(--muted); margin-bottom: 5px; }
    .cohort-track { height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; }
    .cohort-fill { height: 100%; border-radius: 2px; background: var(--gold); }
    .cohort-members { display: flex; flex-wrap: wrap; gap: 6px; }
    .cohort-member { font-size: 0.68rem; color: var(--muted); background: rgba(255,255,255,0.05); border-radius: 20px; padding: 3px 9px; }

    /* ── CURRICULUM CARDS ── */
    .curr-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .curr-card { background: var(--ink-mid); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
    .curr-num { width: 36px; height: 36px; border-radius: 50%; background: rgba(200,134,10,0.12); border: 1px solid rgba(200,134,10,0.25); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 800; color: var(--gold); flex-shrink: 0; }
    .curr-info { flex: 1; }
    .curr-name { font-size: 0.88rem; font-weight: 600; color: var(--white); margin-bottom: 2px; }
    .curr-meta { font-size: 0.72rem; color: var(--muted); }
    .curr-actions { display: flex; gap: 8px; align-items: center; }
    .toggle-switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.1); border-radius: 22px; transition: 0.2s; }
    .toggle-slider:before { position: absolute; content: ''; height: 16px; width: 16px; left: 3px; bottom: 3px; background: var(--white); border-radius: 50%; transition: 0.2s; }
    .toggle-switch input:checked + .toggle-slider { background: var(--gold); }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

    /* ── DIVIDER ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    /* ── ACTION ROW ── */
    .action-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }

    /* ── INVESTOR SPECIFIC ── */
    .inv-hero { text-align: center; padding: 48px 24px 40px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
    .inv-hero h1 { font-size: 2.4rem; font-weight: 800; color: var(--white); letter-spacing: -0.03em; margin-bottom: 14px; line-height: 1.15; }
    .inv-hero p { font-size: 1rem; color: var(--muted); max-width: 560px; margin: 0 auto; line-height: 1.7; }
    .opp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 32px; }
    .opp-card { background: var(--ink-mid); border: 1px solid var(--border); border-radius: 14px; padding: 20px; text-align: center; }
    .opp-num { font-size: 2rem; font-weight: 800; color: var(--gold); letter-spacing: -0.03em; }
    .opp-label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 28px; right: 28px; background: var(--ink-soft); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 0.82rem; color: var(--white); z-index: 9999; display: none; }
    .toast.show { display: block; }
    .toast.success { border-color: rgba(57,197,128,0.4); }

    @media (max-width: 600px) {
      .site-header { padding: 14px 20px; }
      .nav-tabs { padding: 0 20px; }
      .content { padding: 28px 20px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════ GATE ══════════════════════════════════════════ -->
<div id="gate">
  <div class="gate-mark">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
  </div>
  <div class="gate-title">Six Stars Certification</div>
  <div class="gate-sub">The quality mark earned by the finest craftspeople in the trades. Not bought. Earned.</div>
  <div class="gate-box">
    <div class="gate-label">Access Code</div>
    <input class="gate-input" id="gateInput" type="password" placeholder="Enter your access code" autocomplete="off" onkeydown="if(event.key==='Enter')gateSubmit()">
    <button class="gate-btn" onclick="gateSubmit()">Enter</button>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-hint">
      Professionals: <strong>SIXSTARS-[your phone number]</strong><br>
      Partners &amp; Investors: contact <strong>hello@sixstars.ai</strong>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════ SHELL ══════════════════════════════════════════ -->
<div id="shell" style="display:none">
  <header class="site-header">
    <div class="site-logo">
      <div class="mark">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l1.8 5.6H17l-4.7 3.4 1.8 5.6L10 12.2l-4.1 3.4 1.8-5.6L3 6.6h5.2z"/></svg>
      </div>
      <span class="name">Six Stars</span>
    </div>

function gateSubmit() {
  var val = document.getElementById('gateInput').value.trim();
  var err = document.getElementById('gateError');
  err.textContent = '';
  if (!val) { err.textContent = 'Enter your access code.'; return; }
  if (val === ADMIN_PASS) {
    sessionStorage.setItem(SS_ROLE, 'admin');
    launch('admin');
  } else if (val === INVESTOR_PASS) {
    sessionStorage.setItem(SS_ROLE, 'investor');
    launch('investor');
  } else if (/^SIXSTARS-\d{10}$/.test(val)) {
    sessionStorage.setItem(SS_ROLE, 'pro');
    sessionStorage.setItem('ss_phone', val.replace('SIXSTARS-',''));
    launch('pro');
  } else {
    err.textContent = 'Access code not recognised. Check your code and try again.';
  }
}

function launch(role) {
  seedData();
  document.getElementById('gate').style.display = 'none';
  document.getElementById('shell').style.display = 'block';
  if (role === 'admin') {
    document.getElementById('headerBadge').textContent = 'Admin Console';
    document.getElementById('headerRole').textContent = 'Administrator';
    buildAdminNav();
    showAdminPanel('dashboard');
  } else if (role === 'investor') {
    document.getElementById('headerBadge').textContent = 'Partner Portal';
    document.getElementById('headerRole').textContent = 'Investor / Partner';
    buildInvestorNav();
    showInvestorPanel('overview');
  } else {
    document.getElementById('headerBadge').textContent = 'Certification Portal';
    document.getElementById('headerRole').textContent = 'Professional Applicant';
    buildProNav();
    showProPanel('about');
  }
}

function signOut() {
  sessionStorage.clear();
  document.getElementById('shell').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('gateInput').value = '';
}

function checkSession() {
  var role = sessionStorage.getItem(SS_ROLE);
  if (role) { seedData(); launch(role); }
}

// ── TOAST ──
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function(){ t.className = 'toast'; }, 2800);
}

function buildNav(tabs, clickFn) {

function setActiveTab(id) {
  document.querySelectorAll('.nav-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.id === id); });

function setActivePanel(id) {

function submitApp(e) {

    toast('An application with this phone number already exists.'); return;
  }
  apps.push({ id:'a'+Date.now(), name:document.getElementById('app-name').value, phone:phone, specialty:document.getElementById('app-spec').value, license:document.getElementById('app-lic').value, years:document.getElementById('app-years').value, portfolio:document.getElementById('app-port').value, bio:document.getElementById('app-bio').value, insured:true, status:'pending', applied:new Date().toISOString().slice(0,10), notes:'' });

  toast('Application submitted. You will hear from us within 3 business days.', 'success');
  showProPanel('status');
}

    [['⚒','Craft','Portfolio review, license verification, specialty assessment'],['🛡','Integrity','Background check, insurance verification, dispute history'],['💬','Communication','Training module, response time tracking, client survey scores'],['⏱','Reliability','On-time completion rate, estimate accuracy, no-show record'],['❤','Experience','Six Stars training curriculum, NPS score 70+, verified testimonials'],['✦','Legacy','Before/after documentation, referral rate, anthology submission']].map(function(d) {
      return '<div class="dim-card"><div class="dim-top"><div class="dim-num"><span style="font-size:15px">' + d[0] + '</span></div><div class="dim-name">' + d[1] + '</div></div><div class="dim-desc">' + d[2] + '</div></div>';
    }).join('') + '</div>' +
    '<hr class="divider">' +
    '<div class="sect-eyebrow">The curriculum</div>' +
    '<h2 class="sect-title">13 hours of training. Built around the Six Stars framework.</h2>' +
    '<p class="sect-body">Modules 1 and 2 are self-paced. Modules 3–5 run in cohorts of 20–30 professionals — the cohort model creates accountability and community that self-paced video never achieves. Module 6 is earned only after a real completed project. Total time to certification: 6–10 weeks.</p>';
}

function invRevHTML() {
  return '<div class="sect-eyebrow">Revenue model</div>' +
    '<h2 class="sect-title">Three streams. Recurring at the core.</h2>' +
    '<p class="sect-body">The business is built on certification fees, annual renewals, and a platform commission on booked projects. The renewal is the engine — it scales with the certified professional base and requires no additional cost to deliver.</p>' +
    '<div class="metric-grid">' +
    metricCard('$697', 'Certification fee', 'One-time · per professional', false) +
    metricCard('$397', 'Annual renewal', 'Recurring · per professional', true) +
    metricCard('6%', 'Platform commission', 'Per project booked', false) +
    metricCard('$2,500+', 'Team / enterprise', 'Firms certifying whole crews', false) +
    '</div>' +
    '<hr class="divider">' +
    '<div class="sect-eyebrow">Year-over-year projection</div>' +
    '<div class="card" style="margin-bottom:28px">' +
    revRow('Year 1 — 300 certified professionals', 480900, 1200000) +
    revRow('Year 2 — 750 certified professionals', 936150, 1200000) +
    revRow('Year 3 — 1,500 certified professionals', 1619700, 1200000) +
    '</div>' +
    '<p style="font-size:0.75rem;color:var(--muted);margin-bottom:28px">Projection assumes $697 initial certification, $397 annual renewal, 30 new certifications/month, average 6 projects/year per professional at $12,000 average project value. Commission not included above.</p>' +
    '<div class="sect-eyebrow">The flywheel</div>' +
    '<div class="card"><div style="font-size:0.85rem;font-weight:600;color:var(--white);margin-bottom:14px">Why it compounds</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
    ['Homeowner trusts badge','Hires Six Stars professional','Platform earns commission','Professional earns more','More professionals seek certification','Badge becomes more trusted'].map(function(s,i,a){ return '<span style="font-size:0.75rem;color:var(--muted);background:rgba(255,255,255,0.05);border-radius:20px;padding:5px 12px;border:1px solid var(--border)">' + s + '</span>' + (i<a.length-1?'<span style="color:var(--gold);font-size:0.8rem">→</span>':''); }).join('') +
    '</div></div>';
}

function metricCard(val, label, sub, isGold) {
  return '<div class="metric-card' + (isGold?' gold':'') + '"><div class="metric-label">' + label + '</div><div class="metric-val">' + val + '</div><div class="metric-sub">' + sub + '</div></div>';
}

function revRow(label, val, max) {
  var pct = Math.round((val/max)*100);
  var fmt = '$' + val.toLocaleString();
  return '<div class="rev-row"><div class="rev-label">' + label + '</div><div class="rev-track"><div class="rev-bar" style="width:' + pct + '%"></div></div><div class="rev-val">' + fmt + '</div></div>';
}

function invMarketHTML() {
  return '<div class="sect-eyebrow">Market opportunity</div>' +
    '<h2 class="sect-title">A $500B market with no quality standard.</h2>' +
    '<p class="sect-body">The US home renovation and remodeling market exceeded $500 billion in 2024 and continues to grow as housing stock ages and homeowners invest in place. Yet no universal certification standard exists for the tradespeople who deliver this work. Six Stars is built to become that standard.</p>' +
    '<div class="opp-grid">' +
    oppCard('$500B+', 'US renovation market (2024)') +
    oppCard('3.5M', 'Licensed contractors in the US') +
    oppCard('72%', 'Homeowners who say trust is top factor in hiring') +
    oppCard('$0', 'Universal trade certification revenue captured today') +
    '</div>' +
    '<hr class="divider">' +
    '<div class="sect-eyebrow">Strategic positioning</div>' +
    '<h2 class="sect-title">Not a directory. Not a lead-gen platform. A standard.</h2>' +
    '<p class="sect-body">Angi, HomeAdvisor, and Thumbtack sell access. Six Stars sells trust. The certification is platform-agnostic — a Six Stars badge can appear on any marketplace, on a professional\'s own website, or on physical materials. The platform enforces the standard. The badge travels everywhere.</p>' +
    '<div class="card-grid">' +
    card('Platform-agnostic', 'The badge travels beyond the marketplace', 'A Six Stars professional can display their certification anywhere. This is not a walled garden — it is a universal quality mark.') +
    card('B2B expansion', 'Developers, insurers, supply chains', 'Real estate developers can require Six Stars for contractor lists. Insurers can offer premium discounts. Supply partners can offer trade pricing.') +
    card('Recurring IP', 'The curriculum is the moat', 'The Six Stars training methodology — built around six proven dimensions of professional excellence — is proprietary. It cannot be replicated without the framework.') +
    '</div>';
}

// ════════════════════════════════════════════════════════
//  ADMIN CONSOLE
// ════════════════════════════════════════════════════════
var ADMIN_TABS = [
  { id:'dashboard', label:'Dashboard' },
  { id:'applications', label:'Applications' },
  { id:'professionals', label:'Professionals' },
  { id:'cohorts', label:'Cohorts' },
  { id:'revenue', label:'Revenue' },
  { id:'curriculum', label:'Curriculum' }
];
function buildAdminNav() { buildNav(ADMIN_TABS, 'showAdminPanel'); }

function showAdminPanel(id) {
  setActiveTab(id);
  var mc = document.getElementById('mainContent');
  mc.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'panel active';
  if (id === 'dashboard')    panel.innerHTML = adminDashHTML();
  else if (id === 'applications') panel.innerHTML = adminAppsHTML();
  else if (id === 'professionals') panel.innerHTML = adminProsHTML();
  else if (id === 'cohorts') panel.innerHTML = adminCohHTML();
  else if (id === 'revenue') panel.innerHTML = adminRevHTML();
  else if (id === 'curriculum') panel.innerHTML = adminCurrHTML();
  mc.appendChild(panel);
}

function adminDashHTML() {
  var apps = JSON.parse(localStorage.getItem(SS_APPS)||'[]');
  var pros = JSON.parse(localStorage.getItem(SS_PROS)||'[]');
  var cohs = JSON.parse(localStorage.getItem(SS_COH)||'[]');
  var pending = apps.filter(function(a){return a.status==='pending';}).length;
  var certified = pros.filter(function(p){return p.status==='certified';}).length;
  var activeCohs = cohs.filter(function(c){return c.status==='active';}).length;
  var certRev = apps.filter(function(a){return a.status==='approved';}).length * 697;
  var renewRev = certified * 397;
  return '<div class="sect-eyebrow">Admin Console</div>' +
    '<h2 class="sect-title">Six Stars — Overview</h2>' +
    '<div class="metric-grid">' +
    metricCard(pending, 'Pending applications', 'Awaiting review', false) +
    metricCard(apps.length, 'Total applications', 'All time', false) +
    metricCard(certified, 'Certified professionals', 'Active badges', true) +
    metricCard(activeCohs, 'Active cohorts', 'In training', false) +
    metricCard('$' + certRev.toLocaleString(), 'Certification revenue', 'All time', false) +
    metricCard('$' + renewRev.toLocaleString(), 'Annual renewal value', 'Current base', true) +
    '</div>' +
    '<hr class="divider">' +
    '<div class="sect-eyebrow">Recent applications</div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Specialty</th><th>Applied</th><th>Status</th><th>Action</th></tr></thead><tbody>' +
    apps.slice(-5).reverse().map(function(a){
      return '<tr><td class="td-name">' + a.name + '</td><td>' + a.specialty + '</td><td>' + a.applied + '</td><td><span class="pill pill-' + a.status + '">' + a.status + '</span></td><td><button class="btn btn-ghost btn-sm" onclick="showAdminPanel(\'applications\')">Review</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}

function adminAppsHTML() {
  var apps = JSON.parse(localStorage.getItem(SS_APPS)||'[]');
  return '<div class="sect-eyebrow">Applications</div>' +
    '<div class="action-row"><h2 class="sect-title" style="margin-bottom:0">All Applications</h2></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Specialty</th><th>License</th><th>Years</th><th>Insured</th><th>Applied</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
    apps.map(function(a){
      return '<tr><td class="td-name">' + a.name + '</td><td style="font-family:monospace;font-size:0.78rem">' + a.phone + '</td><td>' + a.specialty + '</td><td style="font-family:monospace;font-size:0.78rem">' + a.license + '</td><td>' + a.years + '</td><td>' + (a.insured?'✓':'✗') + '</td><td>' + a.applied + '</td>' +
        '<td><span class="pill pill-' + a.status + '">' + a.status + '</span></td>' +
        '<td><div style="display:flex;gap:6px;flex-wrap:wrap">' +
        (a.status==='pending'?'<button class="btn btn-gold btn-sm" onclick="appAction(\'' + a.id + '\',\'approved\')">Approve</button><button class="btn btn-ghost btn-sm" onclick="appNote(\'' + a.id + '\')">Info</button><button class="btn btn-danger btn-sm" onclick="appAction(\'' + a.id + '\',\'denied\')">Deny</button>':'') +
        (a.status==='approved'?'<button class="btn btn-ghost btn-sm" onclick="certifyPro(\'' + a.id + '\')">Certify</button>':'') +
        '</div></td></tr>';
    }).join('') + '</tbody></table></div>';
}

function appAction(id, status) {
  var apps = JSON.parse(localStorage.getItem(SS_APPS)||'[]');
  var a = apps.find(function(x){return x.id===id;});
  if (a) { a.status = status; localStorage.setItem(SS_APPS, JSON.stringify(apps)); toast('Application ' + status, 'success'); showAdminPanel('applications'); }
}

function appNote(id) {
  var note = prompt('Enter note for applicant:');
  if (note) {
    var apps = JSON.parse(localStorage.getItem(SS_APPS)||'[]');
    var a = apps.find(function(x){return x.id===id;});
    if (a) { a.status = 'info'; a.notes = note; localStorage.setItem(SS_APPS, JSON.stringify(apps)); toast('Note sent', 'success'); showAdminPanel('applications'); }
  }
}

function certifyPro(appId) {
  var apps = JSON.parse(localStorage.getItem(SS_APPS)||'[]');
  var a = apps.find(function(x){return x.id===appId;});
  if (!a) return;
  var pros = JSON.parse(localStorage.getItem(SS_PROS)||'[]');
  if (pros.find(function(p){return p.phone===a.phone;})) { toast('Already certified.'); return; }
  var today = new Date().toISOString().slice(0,10);
  var renewal = new Date(); renewal.setFullYear(renewal.getFullYear()+1);
  pros.push({ id:'p'+Date.now(), name:a.name, specialty:a.specialty, phone:a.phone, certified:today, renewal:renewal.toISOString().slice(0,10), status:'certified', stars:{craft:80,integrity:90,communication:75,reliability:85,experience:70,legacy:0} });
  localStorage.setItem(SS_PROS, JSON.stringify(pros));
  toast(a.name + ' certified!', 'success');
  showAdminPanel('professionals');
}

function adminProsHTML() {
  var pros = JSON.parse(localStorage.getItem(SS_PROS)||'[]');
  return '<div class="sect-eyebrow">Certified Professionals</div>' +
    '<div class="action-row"><h2 class="sect-title" style="margin-bottom:0">' + pros.length + ' Certified</h2></div>' +
    '<div style="display:flex;flex-direction:column;gap:14px">' +
    pros.map(function(p){
      var s = p.stars;
      return '<div class="card"><div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">' +
        '<div><div style="font-size:0.95rem;font-weight:700;color:var(--white)">' + p.name + '</div><div style="font-size:0.78rem;color:var(--muted);margin-top:2px">' + p.specialty + ' · Certified ' + p.certified + ' · Renewal ' + p.renewal + '</div></div>' +
        '<div style="display:flex;gap:8px;align-items:center"><span class="pill pill-' + p.status + '">' + p.status + '</span>' +
        '<button class="btn btn-ghost btn-sm" onclick="suspendPro(\'' + p.id + '\')">Suspend</button></div></div>' +
        '<div class="star-bars">' +
        Object.entries(s).map(function(e){ return '<div class="star-row"><div class="star-dim">' + e[0].charAt(0).toUpperCase()+e[0].slice(1) + '</div><div class="star-track"><div class="star-fill" style="width:' + e[1] + '%"></div></div><div class="star-score">' + e[1] + '</div></div>'; }).join('') +
        '</div></div>';
    }).join('') + '</div>';
}

function suspendPro(id) {
  var pros = JSON.parse(localStorage.getItem(SS_PROS)||'[]');
  var p = pros.find(function(x){return x.id===id;});
  if (p) { p.status = p.status==='certified'?'suspended':'certified'; localStorage.setItem(SS_PROS,JSON.stringify(pros)); toast('Status updated','success'); showAdminPanel('professionals'); }
}

function adminCohHTML() {
  var cohs = JSON.parse(localStorage.getItem(SS_COH)||'[]');
  return '<div class="sect-eyebrow">Cohorts</div>' +
    '<div class="action-row"><h2 class="sect-title" style="margin-bottom:0">Cohort Management</h2><button class="btn btn-gold" onclick="addCohort()">+ New Cohort</button></div>' +
    '<div class="cohort-grid">' +
    cohs.map(function(c){
      return '<div class="cohort-card"><div class="cohort-name">' + c.name + '</div>' +
        '<div class="cohort-dates">' + c.start + ' → ' + c.grad + ' · <span class="pill pill-' + (c.status==='graduated'?'approved':'pending') + '">' + c.status + '</span></div>' +
        '<div class="cohort-progress"><div class="cohort-prog-label">Progress: ' + c.progress + '%</div><div class="cohort-track"><div class="cohort-fill" style="width:' + c.progress + '%"></div></div></div>' +
        '<div class="cohort-members">' + c.members.map(function(m){return '<span class="cohort-member">' + m + '</span>';}).join('') + '</div></div>';
    }).join('') + '</div>';
}

function addCohort() {
  var name = prompt('Cohort name (e.g. Cohort 03 — Fall 2026):');
  if (!name) return;
  var cohs = JSON.parse(localStorage.getItem(SS_COH)||'[]');
  cohs.push({ id:'c'+Date.now(), name:name, start:new Date().toISOString().slice(0,10), grad:'', members:[], progress:0, status:'active' });
  localStorage.setItem(SS_COH, JSON.stringify(cohs));
  toast('Cohort created','success');
  showAdminPanel('cohorts');
}

function adminRevHTML() {
  var pros = JSON.parse(localStorage.getItem(SS_PROS)||'[]');
  var apps = JSON.parse(localStorage.getItem(SS_APPS)||'[]');
  var certified = pros.filter(function(p){return p.status==='certified';}).length;
  var approved = apps.filter(function(a){return a.status==='approved';}).length;
  var certRev = approved * 697;
  var renewRev = certified * 397;
  var commEst = certified * 6 * 12000 * 0.06;
  var total = certRev + renewRev + commEst;
  return '<div class="sect-eyebrow">Revenue</div>' +
    '<h2 class="sect-title">Revenue Dashboard</h2>' +
    '<div class="metric-grid">' +
    metricCard('$'+certRev.toLocaleString(),'Certification revenue','All time · $697 per approval',false) +
    metricCard('$'+renewRev.toLocaleString(),'Annual renewal run-rate','Current base · $397 each',true) +
    metricCard('$'+Math.round(commEst).toLocaleString(),'Commission estimate','6% · 6 proj/yr · $12k avg',false) +
    metricCard('$'+Math.round(total).toLocaleString(),'Total estimated annual','Combined streams',true) +
    '</div>' +
    '<hr class="divider">' +
    '<div class="sect-eyebrow">Stream breakdown</div>' +
    '<div class="card" style="margin-bottom:24px">' +
    revRow('Certification fees', certRev, total||1) +
    revRow('Annual renewals', renewRev, total||1) +
    revRow('Platform commissions (est.)', Math.round(commEst), total||1) +
    '</div>' +
    '<div class="sect-eyebrow">Renewals due — next 90 days</div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Professional</th><th>Certified</th><th>Renewal Due</th><th>Status</th></tr></thead><tbody>' +
    pros.map(function(p){ return '<tr><td class="td-name">'+p.name+'</td><td>'+p.certified+'</td><td>'+p.renewal+'</td><td><span class="pill pill-'+p.status+'">'+p.status+'</span></td></tr>'; }).join('') +
    '</tbody></table></div>';
}

function adminCurrHTML() {
  var mods = JSON.parse(localStorage.getItem(SS_CURR)||'[]');
  return '<div class="sect-eyebrow">Curriculum</div>' +
    '<h2 class="sect-title">Module Management</h2>' +
    '<p class="sect-body" style="margin-bottom:20px">Toggle modules live or draft. Unpublished modules are hidden from professional applicants but visible here. Last-updated dates track content revisions.</p>' +
    '<div class="curr-list">' +
    mods.map(function(m){
      return '<div class="curr-card">' +
        '<div class="curr-num">' + m.num + '</div>' +
        '<div class="curr-info"><div class="curr-name">Module ' + m.num + ' — ' + m.name + '</div>' +
        '<div class="curr-meta">' + m.time + ' · ' + m.format + ' · Updated ' + m.updated + '</div></div>' +
        '<div class="curr-actions">' +
        '<span style="font-size:0.72rem;color:var(--muted);margin-right:4px">' + (m.published?'Live':'Draft') + '</span>' +
        '<label class="toggle-switch"><input type="checkbox"' + (m.published?' checked':'') + ' onchange="toggleMod(\'' + m.id + '\',this.checked)"><span class="toggle-slider"></span></label>' +
        '<button class="btn btn-ghost btn-sm" onclick="editModTagline(\'' + m.id + '\')">Edit</button>' +
        '</div></div>';
    }).join('') + '</div>';
}

function toggleMod(id, val) {
  var mods = JSON.parse(localStorage.getItem(SS_CURR)||'[]');
  var m = mods.find(function(x){return x.id===id;});
  if (m) { m.published = val; m.updated = new Date().toISOString().slice(0,10); localStorage.setItem(SS_CURR,JSON.stringify(mods)); toast(m.name + ' module ' + (val?'published':'set to draft'),'success'); }
}

function editModTagline(id) {
  var mods = JSON.parse(localStorage.getItem(SS_CURR)||'[]');
  var m = mods.find(function(x){return x.id===id;});
  if (!m) return;
  var t = prompt('Module tagline:', m.tagline);
  if (t) { m.tagline = t; m.updated = new Date().toISOString().slice(0,10); localStorage.setItem(SS_CURR,JSON.stringify(mods)); toast('Module updated','success'); showAdminPanel('curriculum'); }
}

checkSession();
